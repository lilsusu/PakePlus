; PHP 自定义配置 — AI 短剧平台
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 100M
post_max_size = 100M

; OPcache
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0

; Redis
redis.session.locking_enabled = 1

; 日志
error_log = /proc/self/fd/2
log_errors = 1
